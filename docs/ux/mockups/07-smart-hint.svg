<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560">
  <style>
    text{font-family:'Segoe UI','Tahoma',sans-serif;direction:rtl}
    .cap{font-size:18px;font-weight:700;fill:#2b3a42}
    .h{font-size:16px;font-weight:700;fill:#fff}
    .t{font-size:14px;fill:#1b1b1b}
    .tb{font-size:14px;fill:#1b1b1b;font-weight:700}
    .s{font-size:12px;fill:#6b7a83}
    .b{font-size:14px;fill:#fff;font-weight:600}
    .btn{fill:#5c7f96;opacity:.92}
    .hot{fill:#3d8b5a}
  </style>
  <rect width="780" height="560" fill="#f6f7f4"/>
  <text x="580" y="34" text-anchor="middle" class="cap">🕖 إذا فتح البوت الساعة 7 الصبح</text>
  <text x="200" y="34" text-anchor="middle" class="cap">🕙 إذا فتحه الساعة 10:30 بالليل</text>

  <g transform="translate(400,50)">
    <rect width="360" height="490" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="474" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="18" y="76" width="290" height="86" rx="12" fill="#fff"/>
    <text x="296" y="101" text-anchor="start" class="tb">☀️ صباح الخير!</text>
    <text x="296" y="126" text-anchor="start" class="t">هلق وقت أذكار الصباح 🌅</text>
    <text x="296" y="150" text-anchor="start" class="s">أو اختار أي شي تاني 👇</text>

    <rect x="18" y="168" width="290" height="40" rx="9" class="hot"/>
    <text x="163" y="193" text-anchor="middle" class="b">🌅 أذكار الصباح  ⭐ وقتها هلق</text>
    <rect x="18" y="212" width="290" height="38" rx="9" class="btn"/>
    <text x="163" y="236" text-anchor="middle" class="b">🌙 أذكار المساء</text>
    <rect x="18" y="254" width="290" height="38" rx="9" class="btn"/>
    <text x="163" y="278" text-anchor="middle" class="b">🌟 أذكار إضافية</text>

    <rect x="30" y="330" width="300" height="110" rx="12" fill="#fff8e1" stroke="#e8c76a"/>
    <text x="318" y="356" text-anchor="start" class="tb">💡 لاحظ:</text>
    <text x="318" y="382" text-anchor="start" class="t">أذكار الصباح صارت أول زر وبلون مميز،</text>
    <text x="318" y="406" text-anchor="start" class="t">بس أذكار المساء لسا موجودة</text>
    <text x="318" y="430" text-anchor="start" class="t">إذا حب يقرأها. ما في شي ممنوع.</text>
  </g>

  <g transform="translate(20,50)">
    <rect width="360" height="490" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="474" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="18" y="76" width="290" height="86" rx="12" fill="#fff"/>
    <text x="296" y="101" text-anchor="start" class="tb">🌙 مساء الخير!</text>
    <text x="296" y="126" text-anchor="start" class="t">هلق وقت أذكار المساء،</text>
    <text x="296" y="150" text-anchor="start" class="t">وإذا ناوي تنام لا تنسى أذكار النوم 😴</text>

    <rect x="18" y="168" width="290" height="40" rx="9" class="hot"/>
    <text x="163" y="193" text-anchor="middle" class="b">🌙 أذكار المساء  ⭐ وقتها هلق</text>
    <rect x="18" y="212" width="290" height="40" rx="9" class="hot" opacity=".8"/>
    <text x="163" y="237" text-anchor="middle" class="b">😴 أذكار النوم</text>
    <rect x="18" y="256" width="290" height="38" rx="9" class="btn"/>
    <text x="163" y="280" text-anchor="middle" class="b">🌅 أذكار الصباح</text>
    <rect x="18" y="298" width="290" height="38" rx="9" class="btn"/>
    <text x="163" y="322" text-anchor="middle" class="b">🌟 أذكار إضافية</text>
  </g>
</svg>
