<svg xmlns="http://www.w3.org/2000/svg" width="780" height="660" viewBox="0 0 780 660">
  <style>
    text{font-family:'Segoe UI','Tahoma',sans-serif;direction:rtl}
    .cap{font-size:18px;font-weight:700;fill:#2b3a42}
    .h{font-size:16px;font-weight:700;fill:#fff}
    .t{font-size:14px;fill:#1b1b1b}
    .tb{font-size:14px;fill:#1b1b1b;font-weight:700}
    .s{font-size:12px;fill:#6b7a83}
    .b{font-size:14px;fill:#fff;font-weight:600}
    .kb{font-size:16px;fill:#1b1b1b;font-weight:700}
    .btn{fill:#5c7f96;opacity:.92}
    .hot{fill:#3d8b5a}
  </style>
  <rect width="780" height="660" fill="#f6f7f4"/>
  <text x="580" y="34" text-anchor="middle" class="cap">① بيضغط «أرسل موقعي»</text>
  <text x="200" y="34" text-anchor="middle" class="cap">② البوت بيعرف بلده ووقته لحاله</text>

  <g transform="translate(400,50)">
    <rect width="360" height="590" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="574" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="18" y="76" width="290" height="110" rx="12" fill="#fff"/>
    <text x="296" y="102" text-anchor="start" class="tb">🌍 وين ساكن؟</text>
    <text x="296" y="130" text-anchor="start" class="t">اضغط الزر الكبير تحت 👇</text>
    <text x="296" y="154" text-anchor="start" class="t">ومنعرف وقتك لحالنا.</text>
    <text x="296" y="176" text-anchor="start" class="s">ما منحفظ موقعك، بس فرق الساعة.</text>

    <rect x="40" y="220" width="280" height="130" rx="14" fill="#fff" stroke="#c7cdd2"/>
    <text x="300" y="250" text-anchor="start" class="tb">📍 الموبايل بيسأل:</text>
    <text x="300" y="278" text-anchor="start" class="t">«السماح لتيليغرام بمعرفة موقعك؟»</text>
    <rect x="180" y="296" width="120" height="36" rx="8" fill="#517da2"/>
    <text x="240" y="319" text-anchor="middle" class="b">سماح</text>
    <rect x="60" y="296" width="110" height="36" rx="8" fill="#eceff1"/>
    <text x="115" y="319" text-anchor="middle" class="t">رفض</text>

    <rect x="8" y="460" width="344" height="122" fill="#d2d6db"/>
    <rect x="18" y="470" width="324" height="50" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="2"/>
    <text x="180" y="502" text-anchor="middle" class="kb">📍 أرسل موقعي (الأسهل)</text>
    <rect x="18" y="526" width="324" height="44" rx="8" fill="#fff"/>
    <text x="180" y="554" text-anchor="middle" class="kb">🗺 بختار بلدي من القائمة</text>
  </g>

  <g transform="translate(20,50)">
    <rect width="360" height="590" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="574" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="172" y="76" width="170" height="110" rx="12" fill="#effdde"/>
    <rect x="180" y="84" width="154" height="94" rx="8" fill="#cfe3c4"/>
    <path d="M190 160 Q230 120 260 140 T330 110" stroke="#9cbf8e" stroke-width="6" fill="none"/>
    <text x="257" y="138" text-anchor="middle" font-size="26">📍</text>

    <rect x="18" y="198" width="300" height="140" rx="12" fill="#fff"/>
    <text x="306" y="224" text-anchor="start" class="tb">✅ عرفنا مكانك: سوريا</text>
    <text x="306" y="254" text-anchor="start" class="t">الساعة عندك هلق: 4:26 العصر</text>
    <text x="306" y="290" text-anchor="start" class="tb">صح هيك؟</text>
    <text x="306" y="316" text-anchor="start" class="s">(إذا الساعة صح، يعني كلشي تمام)</text>

    <rect x="18" y="344" width="300" height="44" rx="9" class="hot"/>
    <text x="168" y="372" text-anchor="middle" class="b">✅ صح</text>
    <rect x="18" y="392" width="300" height="38" rx="9" class="btn"/>
    <text x="168" y="416" text-anchor="middle" class="b">❌ لا، بختار بنفسي</text>
  </g>
</svg>
