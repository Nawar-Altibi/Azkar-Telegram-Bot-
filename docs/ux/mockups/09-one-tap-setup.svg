<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560">
  <style>
    text{font-family:'Segoe UI','Tahoma',sans-serif;direction:rtl}
    .cap{font-size:18px;font-weight:700;fill:#2b3a42}
    .h{font-size:16px;font-weight:700;fill:#fff}
    .t{font-size:14px;fill:#1b1b1b}
    .tb{font-size:14px;fill:#1b1b1b;font-weight:700}
    .s{font-size:12px;fill:#6b7a83}
    .b{font-size:14px;fill:#fff;font-weight:600}
    .btn{fill:#5c7f96;opacity:.92}
    .hot{fill:#3d8b5a}
  </style>
  <rect width="780" height="560" fill="#f6f7f4"/>
  <text x="580" y="34" text-anchor="middle" class="cap">① بعد ما يختار بلده مباشرة</text>
  <text x="200" y="34" text-anchor="middle" class="cap">② ضغط «تمام» وخلص الإعداد 🎉</text>

  <g transform="translate(400,50)">
    <rect width="360" height="490" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="474" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="18" y="76" width="290" height="180" rx="12" fill="#fff"/>
    <text x="296" y="102" text-anchor="start" class="tb">✅ تم حفظ بلدك: سوريا</text>
    <text x="296" y="132" text-anchor="start" class="t">اخترنالك أوقات بتناسب أغلب الناس:</text>
    <text x="296" y="162" text-anchor="start" class="t">🌅 أذكار الصباح: 6:00 صباحًا</text>
    <text x="296" y="188" text-anchor="start" class="t">🌙 أذكار المساء: 5:00 مساءً</text>
    <text x="296" y="220" text-anchor="start" class="tb">بتناسبك هالأوقات؟</text>
    <text x="296" y="242" text-anchor="start" class="s">(بتقدر تغيّرها بأي وقت)</text>

    <rect x="18" y="262" width="290" height="44" rx="9" class="hot"/>
    <text x="163" y="290" text-anchor="middle" class="b">✅ تمام، يلا نبدأ</text>
    <rect x="18" y="310" width="290" height="38" rx="9" class="btn"/>
    <text x="163" y="334" text-anchor="middle" class="b">✏️ بدي اختار أوقات تانية</text>

    <rect x="30" y="380" width="300" height="80" rx="12" fill="#fff8e1" stroke="#e8c76a"/>
    <text x="318" y="406" text-anchor="start" class="tb">💡 الإعداد كلو صار ضغطتين:</text>
    <text x="318" y="432" text-anchor="start" class="t">البلد ← «تمام». بدل 3 أو 4 شاشات.</text>
  </g>

  <g transform="translate(20,50)">
    <rect width="360" height="490" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="474" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="18" y="76" width="300" height="186" rx="12" fill="#fff"/>
    <text x="306" y="102" text-anchor="start" class="tb">🎉 تمام، خلصنا!</text>
    <text x="306" y="132" text-anchor="start" class="t">رح ذكّرك كل يوم بإذن الله:</text>
    <text x="306" y="160" text-anchor="start" class="t">🌅 الساعة 6:00 الصبح</text>
    <text x="306" y="186" text-anchor="start" class="t">🌙 الساعة 5:00 العصر</text>
    <text x="306" y="218" text-anchor="start" class="t">وإذا حبيت تقرأ هلق، اضغط</text>
    <text x="306" y="242" text-anchor="start" class="t">«📖 أذكار اليوم» تحت 👇</text>

    <rect x="8" y="520" width="344" height="1" fill="none"/>
    <rect x="8" y="370" width="344" height="112" fill="#d2d6db"/>
    <rect x="182" y="380" width="160" height="40" rx="7" fill="#fff"/>
    <text x="262" y="405" text-anchor="middle" class="tb">📖 أذكار اليوم</text>
    <rect x="18" y="380" width="160" height="40" rx="7" fill="#fff"/>
    <text x="98" y="405" text-anchor="middle" class="tb">🌟 أذكار إضافية</text>
    <rect x="182" y="426" width="160" height="40" rx="7" fill="#fff"/>
    <text x="262" y="451" text-anchor="middle" class="tb">⚙️ الإعدادات</text>
    <rect x="18" y="426" width="160" height="40" rx="7" fill="#fff"/>
    <text x="98" y="451" text-anchor="middle" class="tb">❓ المساعدة والشرح</text>
  </g>
</svg>
