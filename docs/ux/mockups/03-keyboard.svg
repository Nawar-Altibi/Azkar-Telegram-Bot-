<svg xmlns="http://www.w3.org/2000/svg" width="780" height="720" viewBox="0 0 780 720">
  <style>
    text{font-family:'Segoe UI','Tahoma',sans-serif;direction:rtl}
    .cap{font-size:18px;font-weight:700;fill:#2b3a42}
    .h{font-size:16px;font-weight:700;fill:#fff}
    .t{font-size:14px;fill:#1b1b1b}
    .s{font-size:12px;fill:#6b7a83}
    .k{font-size:14px;fill:#1b1b1b;font-weight:600}
    .bad{font-size:14px;fill:#b3261e;font-weight:700}
    .good{font-size:14px;fill:#1e7b34;font-weight:700}
  </style>
  <rect width="780" height="720" fill="#f6f7f4"/>
  <text x="580" y="34" text-anchor="middle" class="cap">❌ قبل: الأزرار اختفت</text>
  <text x="200" y="34" text-anchor="middle" class="cap">✅ بعد: الأزرار دايمًا ظاهرة</text>

  <g transform="translate(400,50)">
    <rect width="360" height="650" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="634" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="18" y="80" width="290" height="40" rx="12" fill="#fff"/>
    <text x="296" y="105" text-anchor="start" class="t">✅ الحمد لله، تقبّل الله منك 🌿</text>

    <rect x="30" y="200" width="300" height="130" rx="12" fill="#fde8e6" stroke="#e5a49d"/>
    <text x="318" y="228" text-anchor="start" class="bad">😕 شو بيصير هون؟</text>
    <text x="318" y="256" text-anchor="start" class="t">بالغلط سكّر الأزرار، أو تيليغرام خبّاها.</text>
    <text x="318" y="282" text-anchor="start" class="t">ما في غير زر صغير ⌨️ جنب مكان الكتابة،</text>
    <text x="318" y="308" text-anchor="start" class="t">وكبير السن ما بيعرف إنو لازم يضغطه.</text>

    <rect x="8" y="580" width="344" height="62" fill="#fff"/>
    <rect x="58" y="594" width="244" height="36" rx="18" fill="#f1f3f4"/>
    <text x="290" y="617" text-anchor="start" class="s">رسالة</text>
    <text x="40" y="619" text-anchor="middle" class="t">⌨️</text>
    <circle cx="40" cy="613" r="18" fill="none" stroke="#b3261e" stroke-width="2"/>
  </g>

  <g transform="translate(20,50)">
    <rect width="360" height="650" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="634" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="18" y="80" width="290" height="40" rx="12" fill="#fff"/>
    <text x="296" y="105" text-anchor="start" class="t">✅ الحمد لله، تقبّل الله منك 🌿</text>

    <rect x="30" y="180" width="300" height="104" rx="12" fill="#e6f4ea" stroke="#8cc79b"/>
    <text x="318" y="208" text-anchor="start" class="good">😊 الأزرار ما بتختفي أبدًا</text>
    <text x="318" y="236" text-anchor="start" class="t">ومكان الكتابة مكتوب فيه</text>
    <text x="318" y="262" text-anchor="start" class="t">«اختر من الأزرار 👇» ليعرف شو يعمل.</text>

    <rect x="8" y="468" width="344" height="174" fill="#d2d6db"/>
    <rect x="18" y="476" width="324" height="34" rx="17" fill="#fff"/>
    <text x="328" y="498" text-anchor="start" class="s">اختر من الأزرار 👇</text>

    <rect x="182" y="518" width="160" height="36" rx="7" fill="#fff"/>
    <text x="262" y="541" text-anchor="middle" class="k">📖 أذكار اليوم</text>
    <rect x="18" y="518" width="160" height="36" rx="7" fill="#fff"/>
    <text x="98" y="541" text-anchor="middle" class="k">🌟 أذكار إضافية</text>

    <rect x="182" y="558" width="160" height="36" rx="7" fill="#fff"/>
    <text x="262" y="581" text-anchor="middle" class="k">😴 أذكار النوم</text>
    <rect x="18" y="558" width="160" height="36" rx="7" fill="#fff"/>
    <text x="98" y="581" text-anchor="middle" class="k">🌅 أذكار الاستيقاظ</text>

    <rect x="182" y="598" width="160" height="36" rx="7" fill="#fff"/>
    <text x="262" y="621" text-anchor="middle" class="k">⚙️ الإعدادات</text>
    <rect x="18" y="598" width="160" height="36" rx="7" fill="#fff"/>
    <text x="98" y="621" text-anchor="middle" class="k">❓ المساعدة والشرح</text>
  </g>
</svg>
