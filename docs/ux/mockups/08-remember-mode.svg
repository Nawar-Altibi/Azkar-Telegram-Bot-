<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6b73"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Segoe UI','Tahoma',sans-serif;direction:rtl}
    .cap{font-size:18px;font-weight:700;fill:#2b3a42}
    .t{font-size:14px;fill:#1b1b1b}
    .tb{font-size:15px;fill:#1b1b1b;font-weight:700}
    .s{font-size:12px;fill:#6b7a83}
    .box{fill:#fff;stroke:#9fb3bf;stroke-width:1.5}
    .red{fill:#fde8e6;stroke:#e5a49d;stroke-width:1.5}
    .grn{fill:#e6f4ea;stroke:#8cc79b;stroke-width:1.5}
    .ar{stroke:#5c6b73;stroke-width:2;marker-end:url(#a)}
  </style>
  <rect width="780" height="470" fill="#f6f7f4"/>

  <text x="760" y="40" text-anchor="start" class="cap">❌ اليوم: 4 خطوات، وكل مرة بيسألو نفس السؤال</text>

  <rect x="600" y="60" width="160" height="80" rx="12" class="box"/>
  <text x="680" y="94" text-anchor="middle" class="tb">1️⃣ يضغط</text>
  <text x="680" y="120" text-anchor="middle" class="t">«أذكار اليوم»</text>
  <line x1="598" y1="100" x2="572" y2="100" class="ar"/>

  <rect x="410" y="60" width="160" height="80" rx="12" class="box"/>
  <text x="490" y="94" text-anchor="middle" class="tb">2️⃣ يختار</text>
  <text x="490" y="120" text-anchor="middle" class="t">الصباح 🌅</text>
  <line x1="408" y1="100" x2="382" y2="100" class="ar"/>

  <rect x="220" y="60" width="160" height="80" rx="12" class="red"/>
  <text x="300" y="94" text-anchor="middle" class="tb">3️⃣ يختار 🤔</text>
  <text x="300" y="120" text-anchor="middle" class="t">مختصر ولا كامل؟</text>
  <line x1="218" y1="100" x2="192" y2="100" class="ar"/>

  <rect x="30" y="60" width="160" height="80" rx="12" class="box"/>
  <text x="110" y="94" text-anchor="middle" class="tb">4️⃣ تبدأ</text>
  <text x="110" y="120" text-anchor="middle" class="t">القراءة 📖</text>

  <text x="760" y="210" text-anchor="start" class="cap">✅ بعد التعديل: 3 خطوات، والبوت متذكر شو بيحب</text>

  <rect x="600" y="230" width="160" height="80" rx="12" class="box"/>
  <text x="680" y="264" text-anchor="middle" class="tb">1️⃣ يضغط</text>
  <text x="680" y="290" text-anchor="middle" class="t">«أذكار اليوم»</text>
  <line x1="598" y1="270" x2="572" y2="270" class="ar"/>

  <rect x="410" y="230" width="160" height="80" rx="12" class="box"/>
  <text x="490" y="264" text-anchor="middle" class="tb">2️⃣ يختار</text>
  <text x="490" y="290" text-anchor="middle" class="t">الصباح 🌅</text>
  <line x1="408" y1="270" x2="382" y2="270" class="ar"/>

  <rect x="30" y="230" width="350" height="80" rx="12" class="grn"/>
  <text x="205" y="264" text-anchor="middle" class="tb">3️⃣ تبدأ القراءة فورًا 📖</text>
  <text x="205" y="290" text-anchor="middle" class="t">بنفس النوع يلي اختاره آخر مرة (مثلًا: المختصر)</text>

  <rect x="30" y="340" width="730" height="110" rx="12" fill="#fff8e1" stroke="#e8c76a"/>
  <text x="745" y="368" text-anchor="start" class="tb">💡 وإذا بدو يغيّر؟</text>
  <text x="745" y="396" text-anchor="start" class="t">بأول بطاقة بيكون في زر صغير: «📖 بدّل للورد الكامل» أو «🌿 بدّل للمختصر».</text>
  <text x="745" y="422" text-anchor="start" class="t">ولما يبدّل، البوت بيتذكر اختياره الجديد للمرة الجاية.</text>
  <text x="745" y="442" text-anchor="start" class="s">وأول مرة بس (ما في اختيار سابق) البوت بيسأله متل اليوم.</text>
</svg>
