<svg xmlns="http://www.w3.org/2000/svg" width="780" height="720" viewBox="0 0 780 720">
  <style>
    text{font-family:'Segoe UI','Tahoma',sans-serif;direction:rtl}
    .cap{font-size:18px;font-weight:700;fill:#2b3a42}
    .h{font-size:16px;font-weight:700;fill:#fff}
    .t{font-size:14px;fill:#1b1b1b}
    .tb{font-size:14px;fill:#1b1b1b;font-weight:700}
    .s{font-size:12px;fill:#6b7a83}
    .k{font-size:14px;fill:#1b1b1b;font-weight:600}
    .kb{font-size:18px;fill:#1b1b1b;font-weight:700}
  </style>
  <rect width="780" height="720" fill="#f6f7f4"/>
  <text x="580" y="34" text-anchor="middle" class="cap">الوضع العادي (لأغلب الناس)</text>
  <text x="200" y="34" text-anchor="middle" class="cap">👴 الوضع المبسّط (لكبار السن)</text>

  <g transform="translate(400,50)">
    <rect width="360" height="650" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="634" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="30" y="90" width="300" height="200" rx="12" fill="#fff"/>
    <text x="318" y="116" text-anchor="start" class="tb">بالوضع العادي:</text>
    <text x="318" y="146" text-anchor="start" class="t">• 6 أزرار تحت</text>
    <text x="318" y="172" text-anchor="start" class="t">• التذكير رسالة تنبيه، وبعدين بيختار</text>
    <text x="318" y="198" text-anchor="start" class="t">• فيه مختصر وكامل وأذكار إضافية</text>
    <text x="318" y="224" text-anchor="start" class="t">• فيه إعدادات كاملة</text>
    <text x="318" y="260" text-anchor="start" class="s">مناسب لمين متعود على تيليغرام.</text>

    <rect x="8" y="480" width="344" height="162" fill="#d2d6db"/>
    <rect x="182" y="490" width="160" height="40" rx="7" fill="#fff"/>
    <text x="262" y="515" text-anchor="middle" class="k">📖 أذكار اليوم</text>
    <rect x="18" y="490" width="160" height="40" rx="7" fill="#fff"/>
    <text x="98" y="515" text-anchor="middle" class="k">🌟 أذكار إضافية</text>
    <rect x="182" y="536" width="160" height="40" rx="7" fill="#fff"/>
    <text x="262" y="561" text-anchor="middle" class="k">😴 أذكار النوم</text>
    <rect x="18" y="536" width="160" height="40" rx="7" fill="#fff"/>
    <text x="98" y="561" text-anchor="middle" class="k">🌅 أذكار الاستيقاظ</text>
    <rect x="182" y="582" width="160" height="40" rx="7" fill="#fff"/>
    <text x="262" y="607" text-anchor="middle" class="k">⚙️ الإعدادات</text>
    <rect x="18" y="582" width="160" height="40" rx="7" fill="#fff"/>
    <text x="98" y="607" text-anchor="middle" class="k">❓ المساعدة والشرح</text>
  </g>

  <g transform="translate(20,50)">
    <rect width="360" height="650" rx="28" fill="#1f2a33"/>
    <rect x="8" y="8" width="344" height="634" rx="22" fill="#dfe7d3"/>
    <rect x="8" y="8" width="344" height="52" rx="22" fill="#517da2"/>
    <rect x="8" y="38" width="344" height="22" fill="#517da2"/>
    <text x="180" y="40" text-anchor="middle" class="h">بوت الأذكار 🌿</text>

    <rect x="30" y="90" width="300" height="220" rx="12" fill="#e6f4ea" stroke="#8cc79b"/>
    <text x="318" y="116" text-anchor="start" class="tb">بالوضع المبسّط:</text>
    <text x="318" y="146" text-anchor="start" class="t">• 4 أزرار بس، كبار وكل واحد بسطر</text>
    <text x="318" y="172" text-anchor="start" class="t">• التذكير بيوصل ومعه الذكر الأول فورًا</text>
    <text x="318" y="198" text-anchor="start" class="t">• ما في سؤال «مختصر ولا كامل؟»</text>
    <text x="318" y="224" text-anchor="start" class="t">• الصور بدل ملف الـ PDF</text>
    <text x="318" y="250" text-anchor="start" class="t">• رسائل أقصر وكلام أبسط</text>
    <text x="318" y="284" text-anchor="start" class="s">والإعدادات موجودة جوا «المساعدة».</text>

    <rect x="8" y="420" width="344" height="222" fill="#d2d6db"/>
    <rect x="18" y="430" width="324" height="48" rx="8" fill="#fff"/>
    <text x="180" y="461" text-anchor="middle" class="kb">🌅 أذكار الصباح</text>
    <rect x="18" y="482" width="324" height="48" rx="8" fill="#fff"/>
    <text x="180" y="513" text-anchor="middle" class="kb">🌙 أذكار المساء</text>
    <rect x="18" y="534" width="324" height="48" rx="8" fill="#fff"/>
    <text x="180" y="565" text-anchor="middle" class="kb">😴 أذكار النوم</text>
    <rect x="18" y="586" width="324" height="48" rx="8" fill="#fff"/>
    <text x="180" y="617" text-anchor="middle" class="kb">❓ مساعدة</text>
  </g>
</svg>
