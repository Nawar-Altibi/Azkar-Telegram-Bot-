x-app: &app
    image: azkar-bot:local
    restart: unless-stopped
    env_file:
        - .env
    environment:
        APP_ENV: production
        APP_DEBUG: "false"
        APP_URL: http://localhost:${APP_PORT:-8080}
        LOG_CHANNEL: stderr
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: "3306"
        DB_DATABASE: azkar
        DB_USERNAME: azkar
        DB_PASSWORD: ${MYSQL_PASSWORD:-azkar}
        QUEUE_CONNECTION: database
        CACHE_STORE: database
        SESSION_DRIVER: database
    volumes:
        - azkar-storage:/var/www/html/storage

services:
    web:
        <<: *app
        build: .
        ports:
            - "${APP_PORT:-8080}:80"
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 60s

    queue:
        <<: *app
        command: ["queue"]
        depends_on:
            web:
                condition: service_healthy

    scheduler:
        <<: *app
        command: ["scheduler"]
        depends_on:
            web:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: azkar
            MYSQL_USER: azkar
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-azkar}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-azkar-root}
        volumes:
            - azkar-mysql:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

volumes:
    azkar-storage:
    azkar-mysql:
