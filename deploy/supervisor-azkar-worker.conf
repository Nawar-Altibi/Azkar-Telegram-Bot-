[program:azkar-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/azkar/artisan queue:work --sleep=1 --tries=3 --backoff=5,30,120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/azkar/storage/logs/worker.log
stopwaitsecs=60
