name = "anees-wake-gate"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every minute, but the bot is only called when its next work is due (see src/index.js).
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "WAKE_STATE"
class_name = "WakeState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WakeState"]

[vars]
BOT_URL = "https://anees-adhkar-bot.vercel.app"

# CRON_SECRET is a secret: `npx wrangler secret put CRON_SECRET`, same value as the bot's CRON_SECRET.
