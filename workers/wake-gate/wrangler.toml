name = "anees-wake-gate"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Retired: the bot moved to the OVH VPS, whose own scheduler ticks every minute.
# Restore ["* * * * *"] only if the bot runs on Vercel again (it was called only when work was due, see src/index.js).
[triggers]
crons = []

[[durable_objects.bindings]]
name = "WAKE_STATE"
class_name = "WakeState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WakeState"]

[vars]
BOT_URL = "https://anees-adhkar-bot.vercel.app"

# Secrets (`npx wrangler secret put NAME`), each the same value as the bot's env var of that name:
# CRON_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET.
# Telegram's webhook points at this Worker: {worker URL}/telegram/webhook/{TELEGRAM_WEBHOOK_SECRET}.
